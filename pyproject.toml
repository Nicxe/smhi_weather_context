[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["custom_components.smhi_weather_context"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "DTZ",
  "E",
  "F",
  "FA",
  "I",
  "ICN",
  "ISC",
  "LOG",
  "N",
  "PERF",
  "PIE",
  "PT",
  "PTH",
  "RET",
  "RUF",
  "SIM",
  "T20",
  "UP",
  "W",
]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["T201"]

[tool.mypy]
python_version = "3.14"
strict = true
show_error_codes = true
warn_unreachable = true
exclude = ["tests/fixtures/"]

[[tool.mypy.overrides]]
module = ["homeassistant.*"]
ignore_missing_imports = true
