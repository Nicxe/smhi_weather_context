version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    labels:
      - dependencies
    ignore:
      # Release config 1.2.3 requires >=8 <10; revisit when its peer range changes.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types:
          - version-update:semver-major
    groups:
      release-tooling:
        dependency-type: development
        patterns:
          - "@nicxe/*"
          - "@semantic-release/*"
          - conventional-changelog-conventionalcommits
          - semantic-release

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    labels:
      - dependencies
      - github-actions
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      github-actions:
        patterns:
          - "*"
