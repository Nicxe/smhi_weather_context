name: Tests

on:
  push:
    branches: [dev, beta, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Home Assistant tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install test dependencies
        run: >-
          python -m pip install
          pytest-homeassistant-custom-component==0.13.307
          pytest-cov==7.0.0

      - name: Run tests
        run: >-
          python -m pytest tests
          --cov=custom_components.smhi_weather_context
          --cov-branch
          --cov-report=term-missing
          --cov-report=json:coverage.json
          --cov-fail-under=95

      - name: Enforce greater-than-95-percent coverage per module
        run: python scripts/check_coverage.py coverage.json
