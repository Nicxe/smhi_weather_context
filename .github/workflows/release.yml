name: Release

on:
  push:
    branches: [beta, main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the release without creating tags or releases
        required: true
        default: true
        type: boolean
      confirm_release:
        description: Confirm an intentional recovery release run
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Bootstrap pushes create the release branches without creating a release.
    if: >-
      (github.ref_name == 'beta' || github.ref_name == 'main') &&
      ((github.event_name == 'push' && github.event.created == false) ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.dry_run == true || inputs.confirm_release == true)))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install release dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify release inputs
        run: npm run verify:release

      - name: Preview release without publishing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: npx semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Create draft release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Attest release archive
        if: ${{ hashFiles('smhi_weather_context.zip') != '' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true) }}
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: smhi_weather_context.zip
