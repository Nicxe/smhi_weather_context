name: Sync stable release branches

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: branch-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync-beta:
    if: ${{ github.event.release.prerelease == false && github.event.release.target_commitish == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Fast-forward beta to the published stable release
        run: git push origin main:beta

  sync-dev:
    needs: sync-beta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: beta
          fetch-depth: 0

      - name: Fast-forward dev to synchronized beta
        run: git push origin beta:dev
