name: Sync beta back to dev

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: branch-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event.release.prerelease == true && github.event.release.target_commitish == 'beta' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: beta
          fetch-depth: 0

      - name: Fast-forward dev to the published beta
        run: git push origin beta:dev
